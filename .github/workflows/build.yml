name: Build macOS App
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile Swift Code
      run: |
        # Create App bundle structure
        mkdir -p SlideLock.app/Contents/MacOS
        mkdir -p SlideLock.app/Contents/Resources
        
        # Compile raw Swift files into Mach-O executable for both architectures.
        swiftc -parse-as-library $(find TeachingProtect -name "*.swift") -o SlideLock_x86_64 -target x86_64-apple-macosx11.0 -framework IOKit -framework SwiftUI -framework AppKit -framework Foundation -framework CoreGraphics
        swiftc -parse-as-library $(find TeachingProtect -name "*.swift") -o SlideLock_arm64 -target arm64-apple-macosx11.0 -framework IOKit -framework SwiftUI -framework AppKit -framework Foundation -framework CoreGraphics
        lipo -create -output SlideLock.app/Contents/MacOS/SlideLock SlideLock_x86_64 SlideLock_arm64

        # Create Info.plist
        cat <<EOF > SlideLock.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>SlideLock</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.SlideLock</string>
            <key>CFBundleName</key>
            <string>SlideLock</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>LSMinimumSystemVersionByArchitecture</key>
            <dict>
                <key>x86_64</key>
                <string>11.0</string>
                <key>arm64</key>
                <string>11.0</string>
            </dict>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
            <key>NSAppleEventsUsageDescription</key>
            <string>SlideLock cần quyền điều khiển Microsoft PowerPoint và System Events để khóa chức năng Save As / Copy trong lúc học bài.</string>
            <key>NSDesktopFolderUsageDescription</key>
            <string>SlideLock cần quyền truy cập để bảo vệ bản quyền bài giảng và phát hiện sao chép.</string>
            <key>NSDocumentsFolderUsageDescription</key>
            <string>SlideLock cần quyền truy cập để bảo vệ bản quyền bài giảng và phát hiện sao chép.</string>
            <key>NSDownloadsFolderUsageDescription</key>
            <string>SlideLock cần quyền truy cập để bảo vệ bản quyền bài giảng và phát hiện sao chép.</string>
            <key>NSRemovableVolumesUsageDescription</key>
            <string>SlideLock cần quyền truy cập để bảo vệ bản quyền bài giảng trên thiết bị lưu trữ ngoài.</string>
        </dict>
        </plist>
        EOF
        
        chmod +x SlideLock.app/Contents/MacOS/SlideLock
        codesign --force --deep --sign - --entitlements SlideLock.entitlements SlideLock.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SlideLock-App-Built
        path: SlideLock.app

    - name: Create Zip Package
      run: |
        cd SlideLock.app && zip -r ../SlideLock-App-Built.zip . && cd ..

    - name: Release Latest Build
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: latest
        name: "SlideLock Universal Build (Latest)"
        files: SlideLock-App-Built.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
