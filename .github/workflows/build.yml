name: Build macOS App
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile Swift Code
      run: |
        # Create App bundle structure
        mkdir -p SlideLock.app/Contents/MacOS
        mkdir -p SlideLock.app/Contents/Resources
        
        # Compile raw Swift files into Mach-O executable executable
        swiftc -parse-as-library $(find TeachingProtect -name "*.swift") -o SlideLock.app/Contents/MacOS/SlideLock -framework IOKit -framework SwiftUI -framework AppKit -framework Foundation
        
        # Create Info.plist
        cat <<EOF > SlideLock.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>SlideLock</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.SlideLock</string>
            <key>CFBundleName</key>
            <string>SlideLock</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
        </dict>
        </plist>
        EOF
        
        chmod +x SlideLock.app/Contents/MacOS/SlideLock
        codesign --force --deep --sign - SlideLock.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SlideLock-App-Built
        path: SlideLock.app
